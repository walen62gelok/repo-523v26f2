version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "npm"]
    groups:
      npm-security: { applies-to: security-updates, patterns: ["*"] }
      npm-minor-and-patch: { patterns: ["*"], update-types: ["minor", "patch"] }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    labels: ["dependencies", "ci"]
    groups:
      actions-security: { applies-to: security-updates, patterns: ["*"] }
      actions-minor-and-patch: { patterns: ["*"], update-types: ["minor", "patch"] }
